# =============================================
# Application name (shows in logs and actuator)
# =============================================
spring.application.name=personal-finance-tracker

# =============================================
# MongoDB — Local Development
# Assumes MongoDB is running on your machine.
# Start it with: brew services start mongodb-community
# or: mongod --dbpath /usr/local/var/mongodb
# =============================================
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=finance_tracker

# =============================================
# MongoDB — Atlas (Cloud) — uncomment to use
# Replace <username>, <password>, and <cluster>
# with your actual Atlas connection values.
# Comment out the local settings above when using this.
# =============================================
# spring.data.mongodb.uri=mongodb+srv://<username>:<password>@<cluster>.mongodb.net/finance_tracker?retryWrites=true&w=majority

# =============================================
# Server
# =============================================
server.port=8080

# =============================================
# Logging
# Show SQL/MongoDB queries in the console (useful during development)
# =============================================
logging.level.org.springframework.data.mongodb=DEBUG
